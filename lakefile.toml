name = "qlambda"
version = "0.1.0"
keywords = ["domain-theory", "quantum-lambda", "omega-qva", "lean4"]
defaultTargets = ["QLambda", "Challenge", "Solution"]

# QLambda is the proof library. Challenge / Solution are the Palomar
# Comparator pair.

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "QLambda"
globs = ["QLambda", "QLambda.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
