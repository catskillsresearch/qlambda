name = "qlambda"
version = "0.1.0"
keywords = ["domain-theory", "quantum-lambda", "omega-qva", "lean4"]
defaultTargets = ["QLambda", "Challenge", "Solution"]

# QLambda is the proof library. Challenge / Solution are the Palomar
# Comparator pair.

# Existing `private` helpers are referenced from public definitions. The module
# system forbids that unless this porting option is on. Warnings stay off so
# the build remains warning-free while the references are still in place.
moreLeanArgs = [
  "-Dbackward.privateInPublic=true",
  "-Dbackward.privateInPublic.warn=false",
]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "QLambda"
globs = ["QLambda", "QLambda.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "problem"

[[lean_lib]]
name = "workaround"
