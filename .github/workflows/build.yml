name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Lean Project
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout palomar-preflight
        uses: actions/checkout@v4
        with:
          repository: catskillsresearch/palomar-preflight
          ref: bd5bc8f8cc386d7cd0afc16df7ba03a1c64a9fb1
          path: palomar-preflight

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Configure Lake cache
        run: lake exe cache get || true

      - name: Build the development
        run: lake build

      - name: Check Challenge and Solution
        run: |
          lake env lean Challenge.lean
          lake env lean Solution.lean

      - name: Audit publication claims
        run: python3 scripts/audit_publication_claims.py

      - name: Run mechanical Palomar preflight
        run: bash scripts/palomar_preflight.sh --mechanical-only
