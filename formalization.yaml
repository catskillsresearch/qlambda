      lean: "omegaQVA_quantum_domain_equation_solved"
      module: "Challenge (statement), Solution / QLambda.QuantumDomainEquation (proof)"
      status: stated
      note: >-
        Compared by Comparator as a theorem parameterized by a
        QuantumPowerModel. No concrete quantum-powerdomain application
        is currently compared. The iso is constructed from qEmbInfInf /
        qProjInfInf; those maps and the inverse identities are proved
        from the spec. The last conjunct is Scott's inverse-limit
        identity on the quantum tower.

    - source: "The quantum inverse limit is an ωQVA object (arxiv.md, §6–8)"
      lean: "qDInf_isOmegaQVA"
      module: "Challenge (statement), Solution / QLambda.QuantumDomainEquation (proof)"
      status: proved

    - source: "Finite separation implies f(x) ≪ x (CKL Lemma 6.8)"
