version: "v0.4"

project:
  name: "Quantum-valuation approximable domains and the untyped quantum λ-calculus"
  description: >-
    Lean 4 development of the category ωQVA of quantum-valuation
    approximable domains, extending Scott 1972 continuous lattices and
    the Chen–Kou–Lyu saturation pattern to the non-commutative setting.
    The compared statement is the capstone
    omegaQVA_quantum_domain_equation_solved: the inverse limit of the
    quantum tower D_{n+1} = [D_n → Q(D_n)] lies in ωQVA and is
    order-isomorphic to its own function space. Account: arxiv.md.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.LO, math.LO, quant-ph]
  msc2020: ["06B35", "68Q55", "81P68"]

status:
  scope: >-
    Compared claim is the capstone parameterized by a QuantumPowerModel
    (a Q satisfying IsQuantumPowerModel). No concrete quantum-powerdomain
    instance is currently claimed. The tower is
    D_{n+1} = [D_n → Q(D_n)]; qTowerProj, qEmbInfInf, qProjInfInf, and
    the parameterized order isomorphism are defined. Finite Kraus
    families, TNI operations, instruments, and the Type-level monad
    FiniteInstrumentComp are defined and proved. Its semantic preorder
    is now weakest-precondition/TT refinement over monotone Kraus-valued
    postconditions; finite unit, pushforward, and bind congruence are
    proved using residual CP refinement. InstrumentPower now
    antisymmetrizes this basis and takes its Scott-closed lower
    completion. The generic Scott closure operator, complete lattice,
    principal embedding, and conditional direct-image functor laws are
    proved in QLambda/ScottLowerSet.lean. The current exact-CP basis is
    still insufficient: monotone TT observations need not preserve
    directed outcome limits, and for register dimension at least two
    uncountably many rank-one Choi rays obstruct any countable sequence
    of finite separators. Gaussian-rational Choi vectors, strict
    rational quadratic tests, universal Scott-open output observations,
    countably coded output families, finite-token entailment, physical
    Choi monotonicity, Gaussian-rational quadratic separation of
    Hermitian Choi matrices, and the construction of a cofinal countable
    output basis from every IsOmegaQVA witness are now proved in
    QLambda/RationalComplex.lean and QLambda/ObservationBasis.lean.
    QLambda/RoundedTheory.lean constructs the semantic-entailment
    saturated rounded completion of the coded strict tokens and proves
    it is a continuous lattice. Its comparison with TT/Choi refinement
    and the model instance remain open. Nothing in the compared
    statements is imported from a prior Palomar entry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "Scott1972.ContinuousLattice.omegaQVA_quantum_domain_equation_solved"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1972.ContinuousLattice.qDInf_isOmegaQVA"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Scott1972.ContinuousLattice.finitelySeparated_wayBelow"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    QuantumFunctor is the Scott function space [D → Q(D)].
    QFactorable factors through a finite product of Loewner
    spectrahedra (DensityVec), the state space of ⊕ M_{d_k}(ℂ) with
    per-block trace ≤ 1; the paper's S_≤1(⊕ A_i) shares one trace
    budget. Spectral depletion is implemented as the uniform contraction
    Φ_t(ρ) = e^{-max(t,0)} ρ, which is Loewner-monotone; the paper also
    discusses projection-valued erosion. Function-space closure is
    proved independently by finite-separator step-map sampling; it is
    not a field of the quantum functor. The inverse-limit
    instance qDInf_isOmegaQVA is obtained as a Scott-continuous retract
    of the countable product of stages (omegaQVA_pi), which is the
    CKL 6.10(ii) pattern; saturation_flattening (Lemmas 6.8–6.9) is
    mechanized independently. The capstone first conjunct is
    Nonempty (IsOmegaQVA …) because IsOmegaQVA is a data-bearing class.
    vendor/scott1972 is a frozen copy of the author's 1972 remote.
    Chen–Kou–Lyu arXiv:2608.03073 is literature in sources/; there is
    no third-party Lean dependency.

sources:
  - title: "Finite-Valuation Approximable Structures, Quantum λ-Calculus, and the Jung–Tix Problem"
    authors: ["Lars Warren Ericson"]
    type: "notes"
    id: "https://github.com/catskillsresearch/qlambda/blob/main/arxiv.md"
    relationship: other
    author_endorsement: participated
    note: >-
      Write-up of this formalization (arxiv.md). Challenge.lean is
      checked against the named capstone, not against a transcription
      of Chen–Kou–Lyu or Scott 1972 in full.

  - title: "Continuous Lattices"
    authors: ["Dana Scott"]
    type: "article"
    location: "In F. W. Lawvere (ed.), Toposes, Algebraic Geometry and Logic, LNM 274, Springer, 1972"
    relationship: background
    note: >-
      Source of IsContinuousLattice, ≪, inverse limits, and Theorem 4.4.
      Imported from vendor/scott1972. This package does not re-prove
      Scott's internal theorems.

  - title: "Finite-valuation approximable structures: a solution to the Jung–Tix problem of probabilistic powerdomains"
    authors: ["Yuxu Chen", "Hui Kou", "Zhenchao Lyu"]
    type: "article"
    id: "https://arxiv.org/abs/2608.03073"
    relationship: independently-proves
    note: >-
      Source of finite separation (Def. 2.1), Lemma 6.8 (f(x) ≪ x),
      and the 2-level flattening / saturation lemmas (6.3 / 6.9 / 6.10).
      This package independently mechanizes those lemmas in the Scott1972
      continuous-lattice setting and lifts them to ωQVA. The classical
      ωFVA development is not re-formalized in full.

  - title: "The troublesome probabilistic powerdomain"
    authors: ["Achim Jung", "Regina Tix"]
    type: "article"
    location: "ENTCS 13:70–91, 1998"
    relationship: background

  - title: "A linear-non-linear model for a quantum lambda calculus"
    authors: ["Peter Selinger", "Benoît Valiron"]
    type: "article"
    location: "Information and Computation 207(5):603–629, 2009"
    relationship: background

