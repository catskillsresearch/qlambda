version: "v0.4"

project:
  name: "Quantum-valuation approximable domains and the untyped quantum λ-calculus"
  description: >-
    Lean 4 development of the category ωQVA of quantum-valuation
    approximable domains, extending Scott 1972 continuous lattices and
    the Chen–Kou–Lyu saturation pattern to the non-commutative setting.
    The compared statement is the capstone
    omegaQVA_quantum_domain_equation_solved: the inverse limit of the
    quantum tower D_{n+1} = [D_n → Q(D_n)] lies in ωQVA and is
    order-isomorphic to its own function space. The wider development
    instantiates Q by a fixed-register continuation model and embeds finite
    physical instruments into it. Account: arxiv.md.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.LO, math.LO, quant-ph]
  msc2020: ["06B35", "68Q55", "81P68"]

status:
  scope: >-
    Compared claim is the capstone parameterized by a QuantumPowerModel
    (a Q satisfying IsQuantumPowerModel). A concrete fixed-register
    Scott-continuation instance is now bundled as TTContinuation.model;
    it also has a lawful IsQuantumMonad instance. The tower is
    D_{n+1} = [D_n → Q(D_n)]; qTowerProj, qEmbInfInf, qProjInfInf, and
    the parameterized order isomorphism are defined. Finite Kraus
    families, TNI operations, instruments, and the Type-level monad
    FiniteInstrumentComp are defined and proved. Its semantic preorder
    is now weakest-precondition/TT refinement over monotone Kraus-valued
    postconditions; finite unit, pushforward, and bind congruence are
    proved using residual CP refinement. InstrumentPower now
    antisymmetrizes this basis and takes its Scott-closed lower
    completion. The generic Scott closure operator, complete lattice,
    principal embedding, and conditional direct-image functor laws are
    proved in QLambda/ScottLowerSet.lean. The current exact-CP basis is
    still insufficient: monotone TT observations need not preserve
    directed outcome limits, and for register dimension at least two
    uncountably many rank-one Choi rays obstruct any countable sequence
    of finite separators. Gaussian-rational Choi vectors, strict
    rational quadratic tests, universal Scott-open output observations,
    countably coded output families, finite-token entailment, physical
    Choi monotonicity, Gaussian-rational quadratic separation of
    Hermitian Choi matrices, and the construction of a cofinal countable
    output basis from every IsOmegaQVA witness are now proved in
    QLambda/RationalComplex.lean and QLambda/ObservationBasis.lean.
    The output code is closed under finite unions, with a proved finite
    covering lemma for finitely many points in one Scott open.
    QLambda/RoundedTheory.lean constructs the semantic-entailment
    saturated rounded completion of the coded strict tokens and proves
    it is a continuous lattice. QLambda/PhysicalTheory.lean maps finite
    instruments to their satisfied rounded theories and proves that
    theory inclusion is equivalent to pointwise Choi observational
    refinement, using Gaussian-rational density and finite-union branch
    selection. TT refinement is proved to imply this Choi/token order
    using Scott-open indicator postconditions and intrinsic Choi
    reconstruction from CP-map action. A rational qubit counterexample
    over the Bool × Bool diamond proves that the converse fails: every
    Scott-open cumulative Choi difference is positive semidefinite, but
    one monotone Kraus-valued postcondition violates TT refinement.
    Rational CP-valued finite-step postconditions now induce the
    Scott-continuous FinitaryTTRefines order, exactly characterized by
    inclusion of satisfied TT token theories. The saturated completion
    is a continuous lattice and an omegaQVA: finite-prefix membership
    gates are explicitly QFactorable through one-dimensional density
    blocks and finitely separated. Rounded extension is Scott-continuous.
    The concrete power is the continuation carrier [[D → R_n] → R_n]
    over the fixed TT result theory R_n; functoriality, local continuity,
    omegaQVA closure, and monad laws are proved. Rational postcondition
    codes are restricted to TNI CP maps. Result semantics is normalized
    by total TNI Kraus maps, and rational local approximation supports
    Scott-continuous token-local precomposition and finite-instrument
    aggregation. TTPhysicalEmbedding.embed maps finite instruments into
    the continuation carrier. Deterministic return is preserved exactly;
    map and bind agree on finitely presented result continuations.
    Every rational coded TT test has an explicit Scott representation, so
    embedding order unconditionally implies FinitaryTTRefines. A concrete
    directed dyadic-prefix family of finite embeddings has a supremum outside
    the finite image, ruling out a Scott retraction onto that image. The
    computation-valued core now
    parameterizes syntax by closed primitives, adds recursive abstractions,
    and interprets every term by a Scott map into Q(D_infinity). Pure values
    use monadic unit, call-by-value application uses Scott-continuous bind,
    and recursion uses Scott fix. Environment continuity, constructor
    equations, value purity, recursive unfolding, and the pure semantic beta
    equation are proved. Full renaming/weakening/substitution correspondence,
    operational soundness and adequacy, and concrete
    probabilistic/internal/external choice operations remain open. Nothing in
    the compared statements is imported from a prior Palomar entry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "Scott1972.ContinuousLattice.omegaQVA_quantum_domain_equation_solved"
      file: "Solution.lean"
      sorry_count: 0
