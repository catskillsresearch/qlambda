# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Domain Semantics and Circuit Completeness for a Typed Linear Quantum Lambda-Calculus"
  description: >-
    Lean 4 formalization of a Church-style linear/nonlinear quantum lambda
    calculus, quantum sets and relations, quantum CPO morphisms, a concrete
    Set-to-qRel LNL adjunction, finite-register operational semantics,
    deterministic circuit staging, canonical two-wire lambda quotation, and
    structured Composer/OpenQASM interchange.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.LO, math.LO, quant-ph]
  msc2020: ["03B70", "18M05", "68Q55", "81P68", "68V20"]

status:
  scope: >-
    The compared surface contains 29 compared theorems over a Mathlib-only
    Challenge. It restates the source syntax, typing judgment, call-by-value
    reduction, circuit normal form, and canonical quotation, and leaves the
    runtime, quantum-relation, presheaf, staging, and OpenQASM carriers as
    definition holes whose Solution values are the library constants.
    The theorems are closed source type safety; two-wire quotation typing
    and compile reflection; finite-runtime preservation, progress, and Born
    normalization; quantum-relation associativity, dagger, identity, and
    countable-join continuity; the discrete qubit qCPO; identity of the
    Set-to-qRel linear objects with qRelCategory and of qCPOCategory objects
    with QuantumCPO; projection-chain shift inverses; primitive and cx
    completed-CP agreement; the closed measure-new0 measureElim equation;
    deterministic well-formed staging with CQ compile agreement; OpenQASM
    render and export round trips; and measured-new0 qubit bound, Born
    masses, and Yoneda branch agreement. Full CQ quotation agreement remains
    the library theorem GeneralQuotation.Quotation.quotation_capstone.
  sorry_count: 80
  sorry_in_definitions: 51
  axioms: ["propext", "Quot.sound", "Classical.choice"]
