automation:
  methods:
    - method: agent
      models: ["Cursor Grok 4.6 (SpaceXAI / Cursor)"]
      framework: "Cursor"
      role: >-
        Palomar packaging, vendoring of scott1972, scaffolding of
        Quantum/ and the capstone statement.
        Generated Lean is provisional until it compiles under
        leanprover/lean4:v4.33.0.
    - method: manual
      models: []
      role: >-
        The author chose the formalization route, reviews every
        definition and claim, and takes sole responsibility for the
        mathematical content. No large language model is listed as a
        co-author.
  notes: >-
    Initial Palomar draft. related_formalizations records scott1972 and
    arXiv:2608.03073. See limitations.

review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: >-
    The author directed and reviewed the development. No external
    review has been performed.

known_gaps: []

limitations:
  - >-
    The compared claim is the named capstone and supporting surface,
    not a formalization of Chen–Kou–Lyu 2026 in full, not a Qiskit
    compiler, and not a Mathlib ingest.
  - >-
    Challenge.lean states the family but does not prove it (Comparator
    convention). Solution.lean re-exports the Quantum/ proofs.
  - >-
    Classical.choice is permitted (1972 topological ≪). There is no
    project-defined axiom and no native_decide in the compared proofs.
  - >-
    QDomain.functionSpace_omega is an explicit Cartesian-closure
    hypothesis so the tower stages stay in ωQVA; it is not discharged
    by a function-space saturation proof in this snapshot.
  - >-
    Saturation Lean in this repo is an original mechanization of
    arXiv:2608.03073 Lemmas 6.5–6.7. Cartesian closure of function
    spaces is the QDomain.functionSpace_omega hypothesis, not a
    discharged theorem. QuantumFunctor is [D → D], not a constructed
    quantum powerdomain.

alignment:
  namespace: "Scott1972.ContinuousLattice"
  statements:
    - source: "D_∞ of the quantum tower is in ωQVA and D_∞ ≅ [D_∞ → Q(D_∞)] (arxiv.md, §8)"
      lean: "omegaQVA_quantum_domain_equation_solved"
      module: "Challenge (statement), Solution / Quantum.QuantumDomainEquation (proof)"
      status: proved
      note: >-
        Compared by Comparator as a theorem. Inverse-limit identities
        are Scott 1972 Theorem 4.4; ωQVA membership is saturation of
        the embedding–projection sequence.

    - source: "The quantum inverse limit is an ωQVA object (arxiv.md, §6–8)"
      lean: "qDInf_isOmegaQVA"
      module: "Challenge (statement), Solution / Quantum.QuantumDomainEquation (proof)"
      status: proved

    - source: "Finite separation implies f(x) ≪ x (CKL Lemma 6.8)"
      lean: "finitelySeparated_wayBelow"
      module: "Challenge (statement), Solution / Quantum.Saturation (proof)"
      status: proved
