# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Domain Semantics and Circuit Completeness for a Typed Linear Quantum Lambda-Calculus"
  description: >-
    Lean 4 formalization of a Church-style linear/nonlinear quantum lambda
    calculus, quantum sets and relations, quantum CPO morphisms, a concrete
    Set-to-qRel LNL adjunction, finite-register operational semantics,
    deterministic circuit staging, canonical two-wire lambda quotation, and
    structured Composer/OpenQASM interchange.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.LO, math.LO, quant-ph]
  msc2020: ["03B70", "18M05", "68Q55", "81P68", "68V20"]

status:
  scope: >-
    The compared surface contains two declarations over a Mathlib-only
    Challenge that restates the source syntax, typing judgment,
    call-by-value reduction, circuit normal form, and canonical quotation.
    First, type safety for closed programs of the typed linear quantum
    lambda-calculus: progress to a value, a classical step, or a quantum
    primitive boundary; determinism of classical steps; and preservation of
    the type by classical and measurement steps. Second, the two-wire
    quotation_capstone (typing + exact compile reflection) for every Quotable
    command in the supported two-qubit/one-bit fragment. Full CQ agreement is
    proved in-tree as GeneralQuotation.Quotation.quotation_capstone and staged
    for a later comparator expansion. N-bounded fragment denotation packaging
    and measured new0 Born adequacy are likewise checked in-tree and staged
    for comparator expansion. The Set-to-qRel LNL model and the qCPO category
    are checked in the development but are not compared.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "QLambda.Palomar.source_type_safety"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "QLambda.Palomar.quotation_capstone"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    Composer/OpenQASM is a finite ideal interchange target, not the semantic
    model and not the Qiskit Python API. The quotation completeness theorem
    covers the declared two-wire fragment rather than exact finite synthesis
    of arbitrary unitaries. The concrete LNL bridge is Set to quantum
    relations; the separate quantum-CPO category packages Scott-continuous
    quantum functions. No equivalence between these two categorical
    presentations is claimed.

sources:
  - title: "Quantum relations"
    authors: ["Nik Weaver"]
    type: paper
    location: "Memoirs of the American Mathematical Society 215(1010), 2012"
    relationship: background
  - title: "Quantum CPOs"
    authors: ["Andre Kornell", "Bert Lindenhovius", "Michael Mislove"]
    type: paper
    id: "https://arxiv.org/abs/2109.02196"
    relationship: background
  - title: "A linear-non-linear model for a quantum lambda calculus"
    authors: ["Peter Selinger", "Benoît Valiron"]
    type: paper
    location: "Information and Computation 207(5):603–629, 2009"
    relationship: background
  - title: "Typed linear qlambda formalization"
    authors: ["Lars Warren Ericson"]
    type: original-proof
    relationship: other
    author_endorsement: participated
    note: >-
      Original Lean proofs for the selected representation of quantum
      relations, its compact-closed structure and Set adjunction, recursive
      chain shift isomorphism, and certified two-wire circuit quotation.

automation:
  methods:
    - method: agent
      models:
        - "xAI Grok 4.7 (Cursor)"
        - "Anthropic Claude Opus 5.5 (Cursor)"
        - "OpenAI GPT 5.6 (Cursor)"
        - "Cursor Composer 2.5"
      framework: "Cursor"
      role: >-
        Proof exploration, Lean implementation, refactoring, testing, and
        documentation under author direction. Lean kernel checking is the
        proof authority.
    - method: manual
      models: []
      role: >-
        The author selected the model and theorem boundary, reviewed the
        development, and takes responsibility for the mathematical claims.
  notes: "Generated Lean was accepted only after compilation with Lean 4.33.0."

review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: "No external peer review has yet been performed."

known_gaps:
  - "The Set-to-qRel LNL model and the Scott-function qCPO category are not proved equivalent."
  - "The published lifted-qCPO Kleisli LNL construction is not yet formalized."
  - "Allocation, reset, and arbitrary CP instruments are not Weaver quantum functions and require additional semantic structure."
  - "The lambda quotation theorem is limited to the declared two-wire finite fragment."
  - "No theorem models calibration, noise, transpilation, or a physical backend."

limitations:
  - >-
    Challenge.lean intentionally contains theorem holes under the Palomar
    convention; Solution.lean proves the matching statements without sorry.
  - >-
    Circuit completeness means canonical representability of supported
    well-formed circuits, not exact synthesis of every unitary.
  - >-
    Source type safety is for the classical call-by-value relation.
    Applications of quantum primitives and measurements are a declared
    boundary (QuantumBlocked) handled by staging or the register machine,
    whose separate progress and preservation theorems are not compared.
  - >-
    The formalization does not claim full abstraction or unrestricted
    computational adequacy for arbitrary recursive programs.

alignment:
  namespace: "QLambda.Palomar"
  statements:
    - source: "Closed well-typed programs make progress, classical reduction is deterministic, and classical and measurement steps preserve types"
      lean: "source_type_safety"
      module: "Challenge (statement), Solution / QLambda.Linear.Operational (proof)"
      status: proved
    - source: "Every supported two-wire Quotable command has a typed canonical quotation whose compile is the command"
      lean: "quotation_capstone"
      module: "Challenge (statement), Solution / QLambda.Linear.QuotationGeneral (proof)"
      status: proved
