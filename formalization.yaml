known_gaps:
  - "ClosedStuckFreeCoverage is a proved sufficient boundary, not a decision procedure or completeness classification for all non-stuck closed programs."
  - "Arbitrary stuck applications, including payload-under-function states, are excluded."
  - "Interior probability is complete at finitely presented continuations, not at every Scott continuation."

limitations:
  - >-
    The Palomar Comparator selects one theorem:
    omegaQVA_quantum_domain_equation_solved. Challenge.lean states the
    family but does not prove it (Comparator convention). Solution.lean
    imports the QLambda/ proofs.
  - >-
    The entry is not a formalization of Chen–Kou–Lyu 2026 in full, not a
    Qiskit compiler, and not a Mathlib ingest.
  - >-
    Classical.choice is permitted (1972 topological ≪). There is no
    project-defined axiom and no native_decide in the compared proofs.
  - >-
    IsQuantumPowerModel remains the abstract specification used by the
    compared theorem. TTContinuation.model is a concrete instance, and
    TTPhysicalEmbedding.embed now gives the finite physical instrument
    embedding into that carrier. Exact return and finitely presented
    map/bind compatibility are proved. Every rational coded test has a
    proved CodedTestRepresentation witness, so embedding order
    unconditionally implies FinitaryTTRefines. A concrete directed
    dyadic-prefix family yields the unconditional
    no_finiteImageScottRetraction_dyadic theorem. The tower maps, inverse
    identities, and order iso are defined from the spec
    (map, map_mono, map_iSup).
    ωQVA membership of the limit is the retract-of-product argument.
  - >-
    Saturation Lean in this repo is an original mechanization of
    arXiv:2608.03073 Lemmas 6.5–6.7. The concrete continuation power
    satisfies omegaQVA closure. Presented physical channel-tree
    completeness and token adequacy are discharged exactly for
    ClosedStuckFreeCoverage, not for every closed term.

alignment:
  namespace: "Scott1972.ContinuousLattice"
  statements:
    - source: "D_∞ of the quantum tower is in ωQVA and D_∞ ≅ [D_∞ → Q(D_∞)] (arxiv.md, §§5, 7)"
      lean: "omegaQVA_quantum_domain_equation_solved"
      module: "Challenge (statement), Solution / QLambda.QuantumDomainEquation (proof)"
      status: proved
      note: >-
        Compared by Comparator as a theorem parameterized by a
        QuantumPowerModel. TTContinuation.model and the finite physical
        embedding are available, but the comparator still checks the
        parameterized capstone rather than these additional concrete
        theorems.
        The iso is constructed from qEmbInfInf /
        qProjInfInf; those maps and the inverse identities are proved
        from the spec. The last conjunct is Scott's inverse-limit
        identity on the quantum tower.

    - source: "Covered closed stuck-free programs have presented channel-tree completeness"
      lean: "QLambda.HardwareChannelSemantics.closed_stuck_free_presented_channelTreeCompleteness"
      module: "QLambda.HardwareChannel.Coverage"
      status: proved
      note: >-
        Exact boundary is ClosedStuckFreeCoverage: closed NoApp,
        FunAppFrag, Produces 0, ProductiveClosedCase with MeasureDistinct,
        and RestrictedExternApplication. The restricted extern route has
        its own direct proof and does not require MeasureDistinct.

    - source: "Covered closed stuck-free programs satisfy presented TT token adequacy"
      lean: "QLambda.HardwareChannelSemantics.closed_stuck_free_presented_token_adequacy"
      module: "QLambda.HardwareChannel.Coverage"
      status: proved
      note: >-
        Presented adequacy quantifies over finitely represented result
        continuations and realized finite channel trees. It is not
        unrestricted adequacy for every closed term or arbitrary Scott
        continuation.

    - source: "The quantum inverse limit is an ωQVA object (arxiv.md, §§5–7)"
      lean: "qDInf_isOmegaQVA"
      module: "Challenge (statement), Solution / QLambda.QuantumDomainEquation (proof)"
      status: proved

    - source: "Finite separation implies f(x) ≪ x (CKL Lemma 6.8)"
      lean: "finitelySeparated_wayBelow"
      module: "Challenge (statement), Solution / QLambda.Saturation (proof)"
      status: proved
      note: >-
        Proved in the repository but not selected by comparator.json for
        this Palomar entry.
