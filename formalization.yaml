known_gaps:
  - "Extend adequacy beyond the finitely presented primitive fragment to higher-order and recursive terms without assuming that their denotations are finite physical embeddings."
  - "Formalize the rank-one Choi-ray obstruction showing why Scott closure or rational attenuation of the exact physical basis alone cannot establish omegaQVA for register dimension at least two."

limitations:
  - >-
    The compared claim is the named capstone and supporting surface,
    not a formalization of Chen–Kou–Lyu 2026 in full, not a Qiskit
    compiler, and not a Mathlib ingest.
  - >-
    Challenge.lean states the family but does not prove it (Comparator
    convention). Solution.lean re-exports the QLambda/ proofs.
  - >-
    Classical.choice is permitted (1972 topological ≪). There is no
    project-defined axiom and no native_decide in the compared proofs.
  - >-
    IsQuantumPowerModel remains the abstract specification used by the
    compared theorem. TTContinuation.model is a concrete instance, and
    TTPhysicalEmbedding.embed now gives the finite physical instrument
    embedding into that carrier. Exact return and finitely presented
    map/bind compatibility are proved. The refinement result is
    conditional on explicit CodedTestRepresentation witnesses, and the
    retract result is a directed-supremum closure obstruction rather than
    an unconditional no-retract theorem. The tower maps, inverse
    identities, and order iso are defined from the spec
    (map, map_mono, map_iSup).
    ωQVA membership of the limit is the retract-of-product argument.
  - >-
    Saturation Lean in this repo is an original mechanization of
    arXiv:2608.03073 Lemmas 6.5–6.7. The concrete continuation power
    satisfies omegaQVA closure; physical adequacy is not discharged.

