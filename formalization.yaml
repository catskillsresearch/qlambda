known_gaps:
  - "Prove that the token order reconstructs TT/Choi refinement and that physical trace-nonincreasing instruments embed as ideals or form a continuous retract."
  - "Lift finite unit, pushforward, and bind to tokens and prove continuity and local continuity of their Scott-closed extensions."
  - "Construct QFactorable finitely separated approximants for the token completion and only then instantiate IsQuantumPowerModel and IsQuantumMonad."
  - "Formalize the rank-one Choi-ray obstruction showing why Scott closure or rational attenuation of the exact physical basis alone cannot establish omegaQVA for register dimension at least two."
  - "Complete the computation-valued interpretation and operational adequacy proofs."

limitations:
  - >-
    The compared claim is the named capstone and supporting surface,
    not a formalization of Chen–Kou–Lyu 2026 in full, not a Qiskit
    compiler, and not a Mathlib ingest.
  - >-
    Challenge.lean states the family but does not prove it (Comparator
    convention). Solution.lean re-exports the QLambda/ proofs.
  - >-
    Classical.choice is permitted (1972 topological ≪). There is no
    project-defined axiom and no native_decide in the compared proofs.
  - >-
    IsQuantumPowerModel is a conditional specification. No concrete
    quantum-powerdomain instance is claimed. The tower maps, inverse
    identities, and order iso are
    defined from the spec (map, map_mono, map_iSup).
    ωQVA membership of the limit is the retract-of-product argument.
  - >-
    Saturation Lean in this repo is an original mechanization of
    arXiv:2608.03073 Lemmas 6.5–6.7. Closure under a concrete quantum
    instrument powerdomain is not discharged.

