fidelity:
  divergences: >-
    QuantumFunctor is the Scott function space [D → Q(D)].
    QFactorable factors through a finite product of Loewner
    spectrahedra (DensityVec), the state space of ⊕ M_{d_k}(ℂ) with
    per-block trace ≤ 1; the paper's S_≤1(⊕ A_i) shares one trace
    budget. Spectral depletion is implemented as the uniform contraction
    Φ_t(ρ) = e^{-max(t,0)} ρ, which is Loewner-monotone; the paper also
    discusses projection-valued erosion. Function-space closure is
    proved independently by finite-separator step-map sampling; it is
    not a field of the quantum functor. The inverse-limit
    instance qDInf_isOmegaQVA is obtained as a Scott-continuous retract
    of the countable product of stages (omegaQVA_pi), which is the
    CKL 6.10(ii) pattern; saturation_flattening (Lemmas 6.8–6.9) is
    mechanized independently. The capstone first conjunct is
    Nonempty (IsOmegaQVA …) because IsOmegaQVA is a data-bearing class.
    vendor/scott1972 is a frozen copy of the author's 1972 remote.
    Chen–Kou–Lyu arXiv:2608.03073 is literature in sources/; there is
    no third-party Lean dependency.

sources:
  - title: "Parameterized ωQVA quantum domain equation"
    authors: ["Lars Warren Ericson"]
    type: "original-proof"
    relationship: other
    author_endorsement: participated
    note: >-
      First formal presentation of the compared capstone
      omegaQVA_quantum_domain_equation_solved: for bundled quantum power M,
      initial ωQVA domain D₀, and bonding projection j₀, the inverse limit
      D_∞ of the tower D_{n+1} = [D_n → Q(D_n)] lies in ωQVA, satisfies
      mutual inverse identities and an order isomorphism with its function
      space, and satisfies Scott's bilimit identity on the quantum tower.

  - title: "Finite-Valuation Approximable Structures, Quantum λ-Calculus, and the Jung–Tix Problem"
    authors: ["Lars Warren Ericson"]
    type: other
    id: "https://github.com/catskillsresearch/qlambda/blob/main/arxiv.md"
    relationship: other
    author_endorsement: participated
    note: >-
      Informal write-up of the wider repository (arxiv.md). The Palomar
      Comparator checks Challenge.lean against the named capstone only.

  - title: "Continuous Lattices"
    authors: ["Dana Scott"]
    type: paper
    location: "In F. W. Lawvere (ed.), Toposes, Algebraic Geometry and Logic, LNM 274, Springer, 1972"
    relationship: background
    note: >-
      Source of IsContinuousLattice, ≪, inverse limits, and Theorem 4.4.
      Imported from vendor/scott1972. This package does not re-prove
      Scott's internal theorems.

  - title: "Finite-valuation approximable structures: a solution to the Jung–Tix problem of probabilistic powerdomains"
    authors: ["Yuxu Chen", "Hui Kou", "Zhenchao Lyu"]
    type: paper
    id: "https://arxiv.org/abs/2608.03073"
    relationship: background
    note: >-
      Source of the classical finite-separation and saturation pattern used
      in QLambda/Saturation.lean. The compared Palomar theorem is the
      parameterized ωQVA inverse-limit equation, not a formalization of this
      paper in full.

  - title: "The troublesome probabilistic powerdomain"
    authors: ["Achim Jung", "Regina Tix"]
    type: paper
    location: "ENTCS 13:70–91, 1998"
    relationship: background

  - title: "A linear-non-linear model for a quantum lambda calculus"
    authors: ["Peter Selinger", "Benoît Valiron"]
    type: paper
    location: "Information and Computation 207(5):603–629, 2009"
    relationship: background

  - title: "Quantum domain theory—definitions and applications"
    authors: ["Elham Kashefi"]
    type: paper
    location: "Computability and Complexity in Analysis (CCA 2003), 2003"
    relationship: background
    note: >-
      Prior quantum domain theory for computability of quantum states and
      operators. The present ωQVA construction instead uses spectrahedral
      finite-separation witnesses and proves a parameterized inverse-limit
      equation in Lean.

  - title: "Applying quantitative semantics to higher-order quantum computing"
    authors: ["Michele Pagani", "Peter Selinger", "Benoît Valiron"]
    type: paper
    id: "https://doi.org/10.1145/2535838.2535879"
    relationship: background
    note: >-
      Quantitative higher-order quantum semantics. It supplies a different
      linear-semantic architecture; no equivalence with ωQVA is claimed.

  - title: "Quantum CPOs"
    authors: ["Andre Kornell", "Bert Lindenhovius", "Michael Mislove"]
    type: paper
    id: "https://doi.org/10.4204/EPTCS.340.9"
    relationship: background
    note: >-
      The qCPO model supports recursion and recursive types for LNL-FPC and
      Proto-Quipper-M. The compared result here is instead the specific
      spectrahedral ωQVA inverse-limit equation.

  - title: "Enriched presheaf model of Quantum FPC"
    authors: ["Takeshi Tsukada", "Kazuyuki Asada"]
    type: paper
    id: "https://doi.org/10.1145/3632855"
    relationship: background
    note: >-
      A fully abstract model of Quantum FPC with arbitrary recursive types.
      This repository does not claim full abstraction; it contributes a
      Lean-checked ωQVA domain equation and bounded hardware adequacy results.

  - title: "The category-theoretic solution of recursive domain equations"
    authors: ["Michael B. Smyth", "Gordon D. Plotkin"]
    type: paper
    location: "SIAM Journal on Computing 11(4):761–783, 1982"
    relationship: background
    note: >-
      Classical categorical context for solving recursive domain equations
      by inverse-limit constructions. The compared theorem specializes that
      architecture to the parameterized quantum ωQVA tower.

