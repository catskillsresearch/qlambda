        The author selected the model and theorem boundary, reviewed the
        development, and takes responsibility for the mathematical claims.
  notes: "Generated Lean was accepted only after compilation with Lean v4.35.0-rc3, the pin in lean-toolchain and lakefile.toml."

review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: "No external peer review has yet been performed."

known_gaps:
  - "The Set-to-qRel LNL model and the Scott-function qCPO category are not proved equivalent."
  - "The published lifted-qCPO Kleisli LNL construction is not yet formalized."
  - "Allocation, reset, and arbitrary CP instruments are not Weaver quantum functions and require additional semantic structure."
  - "The lambda quotation theorem is limited to the declared two-wire finite fragment."
  - "No theorem models calibration, noise, transpilation, or a physical backend."

limitations:
  - >-
    Challenge.lean contains 29 theorem holes and 51 definition holes under
    the Palomar convention. Solution.lean proves the theorems and supplies
    the library values of the definition holes without sorry.
  - >-
    Circuit completeness means canonical representability of supported
    well-formed circuits, not exact synthesis of every unitary.
  - >-
    Source type safety is for the classical call-by-value relation.
    Applications of quantum primitives and measurements are a declared
    boundary (QuantumBlocked). The finite register machine's preservation,
    progress, and Born normalization are compared separately as
    runtime_internal_preservation, runtime_measurement_preservation,
    runtime_progress, and runtime_born_normalizes.
  - >-
    The formalization does not claim full abstraction or unrestricted
    computational adequacy for arbitrary recursive programs.

